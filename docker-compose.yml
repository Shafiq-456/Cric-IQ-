version: "3.9"

services:

  # ── Endee Vector Database ──────────────────────────────────────────────────
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    environment:
      NDD_NUM_THREADS: 0
      NDD_AUTH_TOKEN: ""
    volumes:
      - endee-data:/data
    restart: unless-stopped

  # ── CricketIQ Backend ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: cricketiq-backend
    ports:
      - "8000:8000"
    environment:
      - ENDEE_BASE_URL=http://endee:8080/api/v1
      - ENDEE_API_TOKEN=
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - endee
    restart: unless-stopped

volumes:
  endee-data:
